# GitHub Actions workflow sample.
# This file is not under .github/workflows because the publisher token used for
# the initial upload did not have the GitHub "workflow" OAuth scope.
#
# To enable it:
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   cp ci/tests.yml .github/workflows/tests.yml
#   git add .github/workflows/tests.yml
#   git commit -m "Enable CI"
#   git push

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q campusnet campus_net.py

      - name: Unit and mock integration tests
        run: python -m unittest discover -s tests -v
