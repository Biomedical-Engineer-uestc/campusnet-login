# CampusNet Login 配置文件
# 首次运行会自动检测门户；也可以手动修改下面的 [portal] 部分。
# 不要把有明文密码的 config.ini 提交到公开仓库！

[account]
# 校园网账号 / 学号
username =

# 密码：推荐留空。留空时首次运行会提示输入，并用系统安全存储保存。
# 只有在明确知道风险时才在这里写明文密码。
password =

# 是否保存手动输入的密码
remember_password = true

[portal]
# auto = 自动识别；也可手动指定 srun / ruijie / generic
protocol = auto

# 首次向导确认后的门户登录页地址。留空则首次运行时自动检测。
url =

# Srun 可选备用地址，逗号分隔
hosts =
# Srun 认证参数；留空时从登录页读取
ac_id =
theme = pro

# 锐捷 ePortal 的服务名（学校不同可能不同，留空则从页面读取）
service =

# 通用表单/锐捷：auto = 自动判断密码是否要 MD5/Base64；也可强制 plain/md5/sha1/base64
password_encoding = auto

# 通用表单可选覆盖项
username_field =
password_field =
login_url =
# 额外表单字段，格式：key=value; key2=value2
extra_fields =
# 自定义成功关键词，逗号分隔
success_keywords =

# 联网检测地址，逗号分隔
connectivity_urls = http://connectivitycheck.gstatic.com/generate_204, http://www.msftconnecttest.com/connecttest.txt, http://connect.rom.miui.com/generate_204, http://captive.apple.com/hotspot-detect.html

timeout = 8
verify_tls = true
# 通用表单提交到不同域名时默认拒绝，避免把密码发到意外地址
allow_cross_origin = false

[watch]
interval = 30
log = true
